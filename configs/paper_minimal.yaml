# Minimal reproducible scenario for paper experiments
defaults:
  bathy:
    bounds: [0.0, 0.0, 6.0, 6.0]
    min_depth_m: 2.0
    dilate_cells: 0
    array:
      - [-8.0, -8.0, -8.0, -8.0, -8.0, -8.0]
      - [-8.0,  1.0,  1.0,  1.0,  1.0, -8.0]
      - [-8.0, -8.0, -8.0, -8.0,  1.0, -8.0]
      - [-8.0,  1.0,  1.0, -8.0, -8.0, -8.0]
      - [-8.0, -8.0, -8.0, -8.0,  1.0, -8.0]
      - [-8.0, -8.0, -8.0, -8.0, -8.0, -8.0]
  planning:
    densify_pts: 4
    smoothness: 0.35
    iterations: 160
    snap_radius: 3
  energy:
    mode: hybrid
    policy: hysteresis
    hysteresis:
      soc_low: 0.35
      soc_high: 0.80
      min_on_s: 900
      min_off_s: 900
      gen_ramp_kw_per_s: 2.0   # optional
    load_profile: synthetic_peaks
    dt_s: 60
    target_speed_kn: 8.0
    hotel_load_kw: 150.0
    propulsion_kw: 600.0
    generator:
      p_max_kw: 1200.0
      p_min_kw: 250.0
    battery:
      capacity_kwh: 4000.0
      soc_init: 0.6
      soc_min: 0.25
      soc_max: 0.95
      p_charge_max_kw: 600.0
      p_discharge_max_kw: 700.0
      eta_charge: 0.96
      eta_discharge: 0.95
    engine_yaml: data/engine_data.yaml
    max_engines: 2
  environment:
    mode: constant
    values:
      wind_speed: 3.0
      wind_angle_diff: 25.0
      wave_height: 0.5
scenarios:
  - name: narrow_channel
    start: [0.5, 0.5]
    goal: [5.5, 5.5]
